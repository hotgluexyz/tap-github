name: Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # Singer's pytz pin selects pandas 1.3.x, which requires NumPy 1.x.
          pip install . hotglue-smoke-test==1.1.8 'numpy<2'
      - name: Replay smoke tests
        run: |
          source .venv/bin/activate
          python -m pytest __smoke-tests__/test_scrubbing.py -q
          hotglue-smoke-test run
